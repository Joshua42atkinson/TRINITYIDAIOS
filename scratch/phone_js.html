<script>
// API base — auto-probe multiple endpoints, pick whichever responds first
// Priority: URL param ?api= → stored (if still works) → Tailscale → Cloudflare → Local
let API = '';
let isStreaming = false;
let chatHistory = [];

const CANDIDATE_URLS = [
  'http://100.83.222.35:3000',    // Tailscale
  'https://trinity.ldtatkinson.com', // Cloudflare tunnel
  'http://192.168.0.69:3000',     // Local WiFi
];

async function probeUrl(url, timeoutMs) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const res = await fetch(url + '/api/health', { signal: ctrl.signal });
    clearTimeout(timer);
    return res.ok;
  } catch(e) {
    clearTimeout(timer);
    return false;
  }
}

async function autoDetectApi() {
  // 1. URL param ?api= always wins
  const urlParam = new URLSearchParams(window.location.search).get('api');
  if (urlParam) {
    localStorage.setItem('trinity_api', urlParam);
    return urlParam;
  }
  // 2. Check stored value first (but verify it works)
  const stored = localStorage.getItem('trinity_api');
  if (stored && await probeUrl(stored, 3000)) {
    return stored;
  }
  // 3. Probe candidates in parallel, pick first that responds
  const results = await Promise.all(CANDIDATE_URLS.map(u => probeUrl(u, 4000)));
  for (let i = 0; i < CANDIDATE_URLS.length; i++) {
    if (results[i]) {
      localStorage.setItem('trinity_api', CANDIDATE_URLS[i]);
      return CANDIDATE_URLS[i];
    }
  }
  // 4. Fallback — last resort, try local
  return CANDIDATE_URLS[CANDIDATE_URLS.length - 1];
}

// Auth token for protected endpoints (hotel, tools, models)
// Set via URL param: ?key=your-key or stored in localStorage
const API_KEY = new URLSearchParams(window.location.search).get('key') || localStorage.getItem('trinity_key') || '';
if (API_KEY) localStorage.setItem('trinity_key', API_KEY);

function authHeaders() {
  return API_KEY ? { 'Authorization': 'Bearer ' + API_KEY } : {};
}

// ── Tab switching ──
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  event.target.closest('.tab').classList.add('active');
  document.getElementById('view-' + tab).classList.add('active');
  if (tab === 'hotel') { pollHealth(); loadHardware(); loadFocusStatus(); loadJobs(); }
  if (tab === 'memory') { loadRagStats(); loadMemoryList(); }
  if (tab === 'quest') loadQuest();
  if (tab === 'assets') { loadGallery(); loadFileBrowser(); }
}

// ── Auto-resize textarea ──
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// ── Chat ──
function addMsg(role, text, saveHistory) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  if (saveHistory !== false) {
    const ts = new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    const tsEl = document.createElement('span');
    tsEl.className = 'timestamp';
    tsEl.textContent = ts;
    div.appendChild(tsEl);
    saveChatMessage(role, text, ts);
  }
  document.getElementById('chat-messages').appendChild(div);
  window.scrollTo(0, document.body.scrollHeight);
  return div;
}

function saveChatMessage(role, text, ts) {
  const history = JSON.parse(localStorage.getItem('trinity_chat') || '[]');
  history.push({ role, text, ts });
  if (history.length > 100) history.shift();
  localStorage.setItem('trinity_chat', JSON.stringify(history));
}

function loadChatHistory() {
  const history = JSON.parse(localStorage.getItem('trinity_chat') || '[]');
  const container = document.getElementById('chat-messages');
  container.innerHTML = '';
  for (const msg of history) {
    const div = document.createElement('div');
    div.className = 'msg ' + msg.role;
    div.textContent = msg.text;
    if (msg.ts) {
      const tsEl = document.createElement('span');
      tsEl.className = 'timestamp';
      tsEl.textContent = msg.ts;
      div.appendChild(tsEl);
    }
    container.appendChild(div);
  }
  window.scrollTo(0, document.body.scrollHeight);
}

function clearChat() {
  localStorage.removeItem('trinity_chat');
  document.getElementById('chat-messages').innerHTML = '';
}

function quickAction(prefix) {
  const input = document.getElementById('chat-input');
  input.value = prefix + ' ';
  input.focus();
  autoResize(input);
}

function renderChatContent(div, text) {
  // Split text into segments: markdown images, code blocks, and plain text
  // First, handle markdown-style image references: ![alt](url)
  const imgPattern = /!\[([^\]]*)\]\(([^)]+)\)/g;
  // Also detect bare image URLs from /api/creative/assets/
  const urlPattern = /(\/api\/creative\/assets\/[^\s\)]+)/g;

  // Remove existing content
  div.innerHTML = '';

  let lastIndex = 0;
  let hasImage = false;
  let match;

  // First pass: find markdown images
  const imgMatches = [...text.matchAll(imgPattern)];
  // Second pass: find bare asset URLs
  const urlMatches = [...text.matchAll(urlPattern)];

  const allMatches = [
    ...imgMatches.map(m => ({ start: m.index, end: m.index + m[0].length, url: m[2], alt: m[1], type: 'md' })),
    ...urlMatches.map(m => ({ start: m.index, end: m.index + m[0].length, url: m[0], alt: 'Generated image', type: 'bare' }))
  ].sort((a, b) => a.start - b.start);

  // Deduplicate overlapping matches (prefer markdown)
  const filtered = [];
  let lastEnd = 0;
  for (const m of allMatches) {
    if (m.start >= lastEnd) {
      filtered.push(m);
      lastEnd = m.end;
    }
  }

  for (const m of filtered) {
    // Text before the image
    if (m.start > lastIndex) {
      const textNode = document.createTextNode(text.slice(lastIndex, m.start));
      div.appendChild(textNode);
    }
    // The image
    const img = document.createElement('img');
    img.src = m.url.startsWith('http') ? m.url : API + m.url;
    img.alt = m.alt;
    img.loading = 'lazy';
    img.style.cssText = 'max-width:100%;border-radius:8px;margin-top:6px;display:block;';
    div.appendChild(img);
    hasImage = true;
    lastIndex = m.end;
  }

  // Remaining text
  if (lastIndex < text.length) {
    const remaining = text.slice(lastIndex);
    div.appendChild(document.createTextNode(remaining));
  }
}

function addImgMsg(url) {
  const div = document.createElement('div');
  div.className = 'msg ai';
  const img = document.createElement('img');
  img.src = url;
  img.loading = 'lazy';
  div.appendChild(img);
  document.getElementById('chat-messages').appendChild(div);
  window.scrollTo(0, document.body.scrollHeight);
}

let currentMode = 'dev';

function setMode(mode) {
  currentMode = mode;
  const btnR = document.getElementById('mode-research');
  const btnB = document.getElementById('mode-build');
  const input = document.getElementById('chat-input');
  if (mode === 'ironroad') {
    btnR.style.background = 'var(--accent)'; btnR.style.color = '#000';
    btnB.style.background = 'transparent'; btnB.style.color = 'var(--text-dim)';
    input.placeholder = 'Ask TRINITY (Socratic mode)...';
  } else {
    btnB.style.background = 'var(--accent)'; btnB.style.color = '#000';
    btnR.style.background = 'transparent'; btnR.style.color = 'var(--text-dim)';
    input.placeholder = 'Tell TRINITY what to build...';
  }
  // Update model badge
  const badge = document.getElementById('model-badge');
  if (badge) {
    if (mode === 'ironroad') {
      badge.className = 'model-badge research';
      badge.textContent = 'Hermes / LM Studio';
    } else {
      badge.className = 'model-badge build';
      badge.textContent = 'DiffusionGemma 26B';
    }
  }
}

async function sendMessage() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text || isStreaming) return;

  addMsg('user', text);
  input.value = '';
  input.style.height = 'auto';

  isStreaming = true;
  document.getElementById('send-btn').disabled = true;
  document.getElementById('chat-status').textContent = 'Thinking...';

  const aiDiv = addMsg('ai', '', false);
  let fullResponse = '';

  // Thinking indicator
  const thinkEl = document.createElement('div');
  thinkEl.className = 'thinking';
  thinkEl.innerHTML = '<span>TRINITY is thinking</span><span class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>';
  aiDiv.appendChild(thinkEl);

  try {
    const res = await fetch(API + '/api/chat/yardmaster', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, mode: currentMode, use_rag: true })
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      let currentEventType = '';
      for (const line of lines) {
        if (line.startsWith('event: ')) {
          currentEventType = line.slice(7).trim();
          // Handle image events immediately
          if (currentEventType === 'image') {
            // Next data: line will contain the image JSON
          }
        } else if (line.startsWith('data: ')) {
          const data = line.slice(6);
          if (data === '[DONE]') continue;
          try {
            const json = JSON.parse(data);
            // Handle image events
            if (currentEventType === 'image') {
              if (json.url) {
                const img = document.createElement('img');
                img.src = API + json.url;
                img.loading = 'lazy';
                img.style.cssText = 'max-width:100%;border-radius:8px;margin-top:6px;';
                aiDiv.appendChild(img);
                window.scrollTo(0, document.body.scrollHeight);
                currentEventType = '';
                continue;
              }
            }
            // Handle tool status
            if (json.status === 'tool' && json.message) {
              const toolDiv = document.createElement('div');
              toolDiv.style.cssText = 'color:var(--blue);font-family:monospace;font-size:11px;padding:2px 0;';
              toolDiv.textContent = '🔧 ' + json.message;
              aiDiv.appendChild(toolDiv);
              window.scrollTo(0, document.body.scrollHeight);
              continue;
            }
            // Handle thinking status
            if (json.status === 'thinking' && json.message) {
              document.getElementById('chat-status').textContent = json.message;
              continue;
            }
            if (json.content) {
              // Remove thinking indicator on first content
              const thinkEl = aiDiv.querySelector('.thinking');
              if (thinkEl) thinkEl.remove();
              fullResponse += json.content;
              renderChatContent(aiDiv, fullResponse);
              window.scrollTo(0, document.body.scrollHeight);
            }
          } catch(e) {
            // Not JSON, might be raw text
            if (data.trim() && currentEventType !== 'image') {
              fullResponse += data;
              renderChatContent(aiDiv, fullResponse);
            }
          }
        }
      }
    }
  } catch(e) {
    aiDiv.textContent = '⚠️ Connection error: ' + e.message;
  }

  if (!fullResponse.trim()) {
    aiDiv.textContent = '⚠️ No response from TRINITY. Check if P model is running.';
  } else {
    // Save AI response to history
    const ts = new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
    saveChatMessage('ai', fullResponse, ts);
    const tsEl = document.createElement('span');
    tsEl.className = 'timestamp';
    tsEl.textContent = ts;
    aiDiv.appendChild(tsEl);
    speak(fullResponse);
  }

  document.getElementById('chat-status').textContent = '';
  isStreaming = false;
  document.getElementById('send-btn').disabled = false;
}

// Enter to send (shift+enter for newline)
document.getElementById('chat-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// ── Health polling ──
async function pollHealth() {
  try {
    const res = await fetch(API + '/api/health');
    const data = await res.json();
    const p = data.creative.programming_online;
    const a = data.creative.aesthetics_online;
    const h = data.llm && data.llm.model_hint && data.llm.model_hint.toLowerCase().includes('hermes');

    const dot = document.getElementById('health-dot');
    const label = document.getElementById('health-label');
    
    if (p || a) {
      dot.className = 'dot on';
      label.textContent = `P${p?'✓':'✗'} A${a?'✓':'✗'} H${h?'✓':'✗'}`;
    } else {
      dot.className = 'dot off';
      label.textContent = 'offline';
    }

    // Update hotel status
    const status = document.getElementById('hotel-status');
    status.innerHTML = `
      <div class="hotel-row"><span class="role" style="color:${p?'var(--green)':'var(--red)'}">P</span><span class="name">DiffusionGemma</span><span class="port">:8000 ${p?'✓':'✗'}</span></div>
      <div class="hotel-row"><span class="role" style="color:${a?'var(--green)':'var(--red)'}">A</span><span class="name">ComfyUI Creative</span><span class="port">:8188 ${a?'✓':'✗'}</span></div>
      <div class="hotel-row"><span class="role" style="color:${h?'var(--green)':'var(--red)'}">H</span><span class="name">Hermes 4 70B</span><span class="port">:8002 ${h?'✓':'✗'}</span></div>
    `;
  } catch(e) {
    document.getElementById('health-dot').className = 'dot off';
    document.getElementById('health-label').textContent = 'offline';
  }
}

// ── Hotel actions ──
async function hotelAction(mode) {
  const btns = document.querySelectorAll('.hotel-btn');
  btns.forEach(b => b.style.opacity = '0.5');
  
  try {
    const endpoint = mode === 'swap' ? '/api/inference/hotel/open' : '/api/inference/hotel/' + mode;
    await fetch(API + endpoint, { method: 'POST', headers: authHeaders() });
    setTimeout(() => pollHealth(), 2000);
  } catch(e) {
    alert('Hotel action failed: ' + e.message);
  }
  
  btns.forEach(b => b.style.opacity = '1');
}

// ── Image generation ──
async function generateImage() {
  const prompt = document.getElementById('img-prompt').value.trim();
  if (!prompt) return;
  
  const btn = document.getElementById('img-btn');
  const result = document.getElementById('img-result');
  
  btn.disabled = true;
  btn.textContent = 'Generating...';
  result.innerHTML = '<div class="img-loading">🎨 Generating image...</div>';

  try {
    const res = await fetch(API + '/api/creative/image', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        prompt: prompt,
        negative_prompt: document.getElementById('img-neg').value || null,
        width: parseInt(document.getElementById('img-w').value) || 512,
        height: parseInt(document.getElementById('img-h').value) || 512,
        style: 'cinematic'
      })
    });
    
    const data = await res.json();
    
    if (data.image_url) {
      result.innerHTML = `<img src="${API + data.image_url}" alt="${prompt}">`;
      addImgMsg(API + data.image_url);
    } else if (data.error) {
      result.innerHTML = `<div class="img-loading">⚠️ ${data.error}</div>`;
    } else {
      result.innerHTML = '<div class="img-loading">⚠️ No image returned</div>';
    }
  } catch(e) {
    result.innerHTML = '<div class="img-loading">⚠️ ' + e.message + '</div>';
  }

  btn.disabled = false;
  btn.textContent = 'Generate';
}

// ── Quest (ADDIECRAPEYE) ──
const PHASES_12 = ['Analysis','Design','Development','Implementation','Evaluation','Contrast','Repetition','Alignment','Proximity','Envision','Yoke','Evolve'];

async function loadQuest() {
  try {
    const res = await fetch(API + '/api/quest');
    const q = await res.json();

    // Current phase
    document.getElementById('quest-phase-title').textContent = `${q.phase_icon || ''} Phase ${q.phase_index + 1}/12: ${q.phase}`;
    document.getElementById('quest-phase-info').innerHTML = q.subject
      ? `Subject: <b>${escapeHtml(q.subject)}</b>`
      : 'No subject set yet. Tell TRINITY what you are building.';

    // Objectives
    const objEl = document.getElementById('quest-objectives');
    if (q.objectives && q.objectives.length > 0) {
      objEl.innerHTML = '<b>Objectives:</b><ul style="margin:4px 0;padding-left:20px">' +
        q.objectives.map(o => `<li>${escapeHtml(o)}</li>`).join('') + '</ul>';
    } else {
      objEl.innerHTML = '<i style="color:var(--text-dim)">No objectives yet for this phase.</i>';
    }

    // Progress
    const completed = (q.completed_phases || []).length;
    document.getElementById('quest-progress').innerHTML =
      `Phases completed: <b>${completed}/12</b><br>XP: <b>${q.xp || 0}</b> | Steam: <b>${q.steam || 0}</b><br>Product maturity: <b>${q.product_maturity ? q.product_maturity.label : 'Raw Material'}</b>`;

    // PEARL
    const pearlEl = document.getElementById('quest-pearl');
    if (q.pearl) {
      pearlEl.innerHTML =
        `Subject: <b>${escapeHtml(q.pearl.subject || '')}</b><br>` +
        `Medium: <b>${escapeHtml(q.pearl.medium || '')}</b><br>` +
        `Vision: <b>${escapeHtml(q.pearl.vision || 'Not set')}</b><br>` +
        `Alignment: <b>${q.pearl.alignment || 0}%</b>`;
    } else {
      pearlEl.innerHTML = '<i>No PEARL set. Tell TRINITY what you are building in chat.</i>';
    }

    // All phases
    const allEl = document.getElementById('quest-all-phases');
    const completedSet = new Set(q.completed_phases || []);
    allEl.innerHTML = PHASES_12.map((name, i) => {
      const done = completedSet.has(name);
      const current = name === q.phase;
      const icon = done ? '✅' : current ? '👉' : '⬜';
      const style = current ? 'color:var(--gold);font-weight:bold' : done ? 'color:var(--green)' : '';
      return `<div style="padding:3px 0;${style}">${icon} ${i + 1}. ${name}</div>`;
    }).join('');

  } catch(e) {
    document.getElementById('quest-phase-title').textContent = 'Failed to load quest';
  }
}

async function advancePhase() {
  try {
    const res = await fetch(API + '/api/quest/advance', { method: 'POST', headers: authHeaders() });
    const data = await res.json();
    loadQuest();
  } catch(e) {
    alert('Failed to advance phase: ' + e.message);
  }
}

// ── Long-Term Memory ──
function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

async function loadMemoryList() {
  try {
    const res = await fetch(API + '/api/memory');
    const data = await res.json();
    const el = document.getElementById('mem-list');
    if (data.length === 0) {
      el.innerHTML = '<div style="color:var(--text-dim);font-size:13px">No memories yet. Add one above.</div>';
      return;
    }
    el.innerHTML = data.map(f => `<div class="mem-item"><div class="content">${escapeHtml(f.content)}<div class="meta">${escapeHtml(f.category)} · ${new Date(f.created_at*1000).toLocaleDateString()}</div></div><span class="del" onclick="deleteMemory(${f.id})">×</span></div>`).join('');
  } catch(e) {
    document.getElementById('mem-list').innerHTML = '<div style="color:var(--text-dim);font-size:13px">Failed to load memories</div>';
  }
}

async function deleteMemory(id) {
  try {
    await fetch(API + '/api/memory/' + id, { method: 'DELETE', headers: authHeaders() });
    loadMemoryList();
  } catch(e) {
    alert('Failed to delete memory');
  }
}

async function rememberFact() {
  const content = document.getElementById('mem-content').value.trim();
  if (!content) return;
  try {
    await fetch(API + '/api/memory', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...authHeaders() },
      body: JSON.stringify({ content, category: 'phone' })
    });
    document.getElementById('mem-content').value = '';
    loadMemoryList();
  } catch(e) {
    alert('Failed to save memory');
  }
}

    const data = await res.json();
    document.getElementById('rag-stats').textContent = 
      `Docs: ${data.documents} | Chunks: ${data.text_chunks} | Vectors: ${data.vector_embeddings} | Dim: ${data.embedding_dim}`;
  } catch(e) {

async function ingestDoc() {
  const title = document.getElementById('rag-title').value.trim();
  const content = document.getElementById('rag-content').value.trim();
  if (!title || !content) return;

  try {
    const res = await fetch(API + '/api/ingest', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, content, category: 'phone' })
    });
    const data = await res.json();
    alert(`✅ Ingested: ${data.chunks_created} chunks`);

    document.getElementById('rag-content').value = '';

  } catch(e) {

async function searchRAG() {
  const query = document.getElementById('rag-query').value.trim();
  if (!query) return;
  
  const results = document.getElementById('rag-results');
  results.innerHTML = 'Searching...';

  try {
    const res = await fetch(API + '/api/rag/search', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query, top_k: 5 })
    });
    const data = await res.json();
    
    if (data.results && data.results.length > 0) {
      results.innerHTML = data.results.map((r, i) => 
        `<div style="padding:8px;margin:4px 0;background:rgba(25,25,25,0.6);border-radius:6px"><b>${i+1}.</b> ${r.substring(0, 200)}...</div>`
      ).join('');
    } else {
      results.innerHTML = 'No results found';
    }
  } catch(e) {
    results.innerHTML = 'Search failed: ' + e.message;
  }
}

// ── Asset Gallery ──
async function loadGallery() {
  const grid = document.getElementById('gallery-grid');
  try {
    const res = await fetch(API + '/api/creative/assets');
    const data = await res.json();
    const assets = data.assets || [];
    if (assets.length === 0) {
      grid.innerHTML = '<div class="gallery-empty">No images yet. Generate one above or ask TRINITY in chat!</div>';
      return;
    }
    // Show only image assets in the gallery
    const images = assets.filter(a => a.asset_type.includes('image') || /\.(png|jpg|jpeg|gif|webp|svg)$/i.test(a.filename));
    if (images.length === 0) {
      grid.innerHTML = '<div class="gallery-empty">No images yet. Generate one above or ask TRINITY in chat!</div>';
      return;
    }
    grid.innerHTML = images.slice(0, 20).map(a => {
      const url = API + a.url;
      const ext = a.filename.split('.').pop().toUpperCase();
      return `<div class="gallery-item" onclick="viewImage('${url}','${escapeHtml(a.filename)}')"><img src="${url}" loading="lazy" alt="${escapeHtml(a.filename)}"><span class="badge">${ext}</span></div>`;
    }).join('');
  } catch(e) {
    grid.innerHTML = '<div class="gallery-empty">Failed to load gallery</div>';
  }
}

function viewImage(url, name) {
  const overlay = document.createElement('div');
  overlay.className = 'viewer-overlay';
  overlay.innerHTML = `<div class="close" onclick="this.parentElement.remove()">×</div><img src="${url}" alt="${name}"><div class="info">${escapeHtml(name)}</div>`;
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
  document.body.appendChild(overlay);
}

// ── File Browser ──
let currentPath = '/home/joshua/Workflow/TRINITYIDAIOS';

async function loadFileBrowser(path) {
  if (path) currentPath = path;
  const listEl = document.getElementById('file-list');
  const pathEl = document.getElementById('file-path');
  pathEl.textContent = currentPath;
  listEl.innerHTML = '<div style="padding:10px;color:var(--text-dim)">Loading...</div>';

  try {
    const res = await fetch(API + '/api/chat/yardmaster', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: 'List directory: ' + currentPath, mode: 'dev', use_rag: false })
    });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let fullText = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const chunk = decoder.decode(value, { stream: true });
      const lines = chunk.split('\n');
      for (const line of lines) {
        if (line.startsWith('data: ')) {
          const data = line.slice(6);
          if (data === '[DONE]') continue;
          try {
            const json = JSON.parse(data);
            if (json.content) fullText += json.content;
          } catch(e) {}
        }
      }
    }
    if (!fullText.trim()) {
      listEl.innerHTML = '<div style="padding:10px;color:var(--text-dim)">No response</div>';
      return;
    }
    // Parse the directory listing from the response
    const entries = fullText.split('\n').filter(l => l.trim()).map(line => {
      const isDir = line.includes('/') || line.includes('[DIR]') || line.includes('directory');
      const name = line.replace(/^[├└─│\s]+/, '').replace(/\/$/, '').replace(/\[DIR\]\s*/, '').trim();
      return { isDir, name: name || line.trim() };
    }).filter(e => e.name && !e.name.startsWith('.'));

    if (entries.length === 0) {
      listEl.innerHTML = '<div style="padding:10px;color:var(--text-dim)">' + escapeHtml(fullText.substring(0, 200)) + '</div>';
      return;
    }

    let html = '';
    if (currentPath !== '/') {
      html += `<div class="file-item" onclick="loadFileBrowser('${currentPath.split('/').slice(0, -1).join('/') || '/'}')"><span class="icon">📁</span><span class="name">..</span><span class="size"></span></div>`;
    }
    for (const e of entries.slice(0, 50)) {
      if (e.isDir) {
        const newPath = currentPath === '/' ? '/' + e.name : currentPath + '/' + e.name;
        html += `<div class="file-item" onclick="loadFileBrowser('${newPath.replace(/'/g, "\\'")}')"><span class="icon">📁</span><span class="name">${escapeHtml(e.name)}/</span><span class="size"></span></div>`;
      } else {
        const ext = e.name.split('.').pop().toLowerCase();
        const icon = ['png','jpg','jpeg','gif','webp','svg'].includes(ext) ? '🖼️' : ['rs','toml'].includes(ext) ? '📄' : ['md','txt'].includes(ext) ? '📝' : '📄';
        html += `<div class="file-item"><span class="icon">${icon}</span><span class="name">${escapeHtml(e.name)}</span><span class="size"></span></div>`;
      }
    }
    listEl.innerHTML = html;
  } catch(e) {
    listEl.innerHTML = '<div style="padding:10px;color:var(--text-dim)">Failed to load: ' + escapeHtml(e.message) + '</div>';
  }
}

// ── Focus Mode ──
async function focusAction(mode) {

async function loadFocusStatus() {

// ── Hardware Stats ──
async function loadHardware() {
  try {
    const res = await fetch(API + '/api/hardware', { headers: authHeaders() });
    const data = await res.json();

    // CPU
    const cpuPct = data.cpu_percent || data.cpu || 0;
    document.getElementById('hw-cpu').textContent = cpuPct.toFixed(0) + '%';
    document.getElementById('hw-cpu-bar').style.width = cpuPct + '%';

    // RAM
    const ramUsed = data.ram_used_gb || data.ram_used || 0;
    const ramTotal = data.ram_total_gb || data.ram_total || 128;
    const ramPct = (ramUsed / ramTotal * 100);
    document.getElementById('hw-ram').textContent = ramUsed.toFixed(1) + '/' + ramTotal + 'GB';
    document.getElementById('hw-ram-bar').style.width = ramPct + '%';

    // GPU
    const gpuPct = data.gpu_percent || data.gpu_util || 0;
    document.getElementById('hw-gpu').textContent = gpuPct.toFixed(0) + '%';
    document.getElementById('hw-gpu-bar').style.width = gpuPct + '%';

    // VRAM
    const vramUsed = data.vram_used_gb || data.vram_used || 0;
    const vramTotal = data.vram_total_gb || data.vram_total || 128;
    const vramPct = (vramUsed / vramTotal * 100);
    document.getElementById('hw-vram').textContent = vramUsed.toFixed(1) + '/' + vramTotal + 'GB';
    document.getElementById('hw-vram-bar').style.width = vramPct + '%';
  } catch(e) {
    // Silently fail — hardware is non-critical
  }
}

// ── Job Queue ──
async function loadJobs() {
  try {
    const res = await fetch(API + '/api/jobs', { headers: authHeaders() });
    const data = await res.json();
    const el = document.getElementById('job-list');
    const jobs = Array.isArray(data) ? data : (data.jobs || []);
    if (jobs.length === 0) {
      el.innerHTML = '<div style="color:var(--text-dim);font-size:12px">No jobs. Submit via chat or API.</div>';
      return;
    }
    el.innerHTML = jobs.slice(0, 10).map(j => {
      const status = j.status || 'pending';
      const statusClass = status.toLowerCase().includes('run') ? 'running' : status.toLowerCase().includes('complete') || status.toLowerCase().includes('done') ? 'completed' : status.toLowerCase().includes('fail') || status.toLowerCase().includes('error') ? 'failed' : 'pending';
      return `<div class="job-item"><span class="job-id">#${j.id || '?'}</span> ${escapeHtml(j.name || j.description || j.tool || 'job')} <span class="job-status ${statusClass}">${escapeHtml(status)}</span></div>`;
    }).join('');
  } catch(e) {
    document.getElementById('job-list').innerHTML = '<div style="color:var(--text-dim);font-size:12px">Job queue unavailable</div>';
  }
}

// ── Voice Input (Web Speech API) ──
let recognition = null;
let isRecording = false;

function toggleVoice() {
  if (isRecording) {
    recognition.stop();
    return;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    alert('Voice input not supported on this browser. Try Chrome on Android.');
    return;
  }
  recognition = new SR();
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.lang = 'en-US';
  
  const btn = document.getElementById('voice-btn');
  const input = document.getElementById('chat-input');
  
  recognition.onstart = () => {
    isRecording = true;
    btn.classList.add('recording');
    btn.textContent = '⏹';
  };
  
  recognition.onresult = (e) => {
    let transcript = '';
    for (let i = 0; i < e.results.length; i++) {
      transcript += e.results[i][0].transcript;
    }
    input.value = transcript;
    autoResize(input);
  };
  
  recognition.onerror = (e) => {
    console.log('Voice error:', e.error);
  };
  
  recognition.onend = () => {
    isRecording = false;
    btn.classList.remove('recording');
    btn.textContent = '🎤';
    // Auto-send if we got text
    if (input.value.trim().length > 0) {
      sendMessage();
    }
  };
  
  recognition.start();
}

// ── Text-to-Speech (read responses aloud) ──
let ttsEnabled = false;
let currentUtterance = null;

function toggleTTS() {
  ttsEnabled = !ttsEnabled;
  const btn = document.getElementById('tts-btn');
  if (ttsEnabled) {
    btn.style.background = 'rgba(207,185,145,0.4)';
    btn.textContent = '🔉';
  } else {
    btn.style.background = '';
    btn.textContent = '🔊';
    if (currentUtterance) speechSynthesis.cancel();
  }
}

function speak(text) {
  if (!ttsEnabled || !text.trim()) return;
  if (currentUtterance) speechSynthesis.cancel();
  currentUtterance = new SpeechSynthesisUtterance(text);
  currentUtterance.rate = 1.0;
  currentUtterance.pitch = 1.0;
  currentUtterance.lang = 'en-US';
  speechSynthesis.speak(currentUtterance);
}

(async function init() {
  const dot = document.getElementById('health-dot');
  const label = document.getElementById('health-label');
  const connLabel = document.getElementById('conn-label');
  const banner = document.getElementById('conn-banner');
  const bannerText = document.getElementById('conn-banner-text');
  
  label.textContent = 'connecting...';
  dot.className = 'dot off';
  
  // Show probing status
  bannerText.textContent = 'Scanning for Trinity...';
  
  API = await autoDetectApi();
  
  // Verify the connection actually works
  const ok = await probeUrl(API, 5000);
  
  if (ok) {
    const connName = API.includes('100.83.') ? 'Tailscale' 
      : API.includes('ldtatkinson.com') ? 'Tunnel' 
      : API.includes('192.168.0') ? 'Local WiFi' 
      : 'Custom';
    
    // Show success banner
    banner.className = 'conn-banner success';
    bannerText.textContent = '✓ Connected via ' + connName;
    
    // Auto-hide banner after 2.5s
    setTimeout(() => { banner.className = 'conn-banner success hidden'; }, 2500);
    
    // Update header label
    connLabel.textContent = connName;
  } else {
    // Show failure banner with link to try other URLs
    banner.className = 'conn-banner failed';
    bannerText.innerHTML = '✗ Could not reach Trinity. <a href="?api=https://trinity.ldtatkinson.com" style="color:inherit;text-decoration:underline">Try Tunnel</a>';
    label.textContent = 'offline';
    dot.className = 'dot off';
    return; // Don't load the rest — nothing to talk to
  }
  
  setMode('dev');
  loadChatHistory();
  pollHealth();
  setInterval(pollHealth, 15000);
})();
