[package]
name = "trinity"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Trinity ID AI OS — HTTP server with restored working implementation"

[dependencies]

# Trinity ecosystem
trinity-protocol = { path = "../trinity-protocol" }
trinity-quest = { path = "../../docs/archive/crates/trinity-quest" }
trinity-iron-road = { path = "../../docs/archive/crates/trinity-iron-road" }
trinity-voice = { path = "../../docs/archive/crates/trinity-voice" }

# HTTP & Web
axum = { version = "0.7", features = ["macros", "multipart", "ws"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
async-stream = "0.3"

# Async
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = "0.3"

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "json"] }

# Error handling
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# File paths
dirs = "5.0"

# Hardware detection
sysinfo = "0.30"

# Random number generation (d20 skill checks)
rand = "0.8"

# UUID generation
uuid = { version = "1.0", features = ["v4"] }

base64 = "0.22.1"

toml = "0.8"

# DOCX export — pure Rust .docx generation for student portfolios
docx-rs = { version = "0.4", optional = true }

zip = { version = "0.6", optional = true }
tokenizers = "0.19"
ort = { version = "2.0.0-rc.12", features = ["download-binaries", "ndarray"] }
ndarray = "0.17"

[features]
default = ["export"]
export = ["dep:docx-rs", "dep:zip"]
ironroad = []


