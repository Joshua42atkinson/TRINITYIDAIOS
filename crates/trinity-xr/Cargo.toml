[package]
name = "trinity-xr"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
description = "Trinity XR — Spatial instructional design workspace (Bevy 0.18 OpenXR)"

[lib]
crate-type = ["lib", "cdylib"]
name = "trinity_xr"

[[bin]]
name = "trinity-xr-desktop"
path = "src/bin/desktop.rs"
required-features = ["desktop"]

[[bin]]
name = "trinity-xr"
path = "src/bin/xr.rs"
required-features = ["xr"]

[features]
default = []
desktop = [
    "bevy/bevy_winit",
    "bevy/bevy_pbr",
    "bevy/bevy_core_pipeline",
    "bevy/bevy_window",
    "bevy/bevy_text",
    "bevy/bevy_ui",
    "bevy/bevy_ui_render",
    "bevy/bevy_scene",
    "bevy/bevy_log",
    "bevy/bevy_state",
    "bevy/bevy_sprite",
    "bevy/bevy_gltf",
    "bevy/bevy_audio",
    "bevy/multi_threaded",
    "bevy/default_font",
    "bevy/tonemapping_luts",
    "bevy/x11",
    "bevy/wayland",
    "bevy/picking",
    "dep:bevy_panorbit_camera",
]
xr = [
    "bevy/bevy_render",
    "bevy/bevy_pbr",
    "bevy/bevy_core_pipeline",
    "bevy/bevy_asset",
    "bevy/bevy_scene",
    "bevy/bevy_text",
    "bevy/bevy_ui",
    "bevy/bevy_ui_render",
    "bevy/bevy_mesh",
    "bevy/bevy_log",
    "bevy/bevy_state",
    "bevy/bevy_gltf",
    "bevy/bevy_audio",
    "bevy/multi_threaded",
    "bevy/default_font",
    "bevy/tonemapping_luts",
    "bevy/picking",
    "dep:bevy_mod_xr",
    "dep:bevy_mod_openxr",
]

[dependencies]
bevy = { workspace = true, features = ["zstd_rust", "png"] }
bevy_reflect = "0.18.1"

bevy_mod_xr = { version = "0.5", optional = true }
bevy_mod_openxr = { version = "0.5", optional = true, features = ["vulkan"] }
openxr = { version = "0.21", optional = true }

bevy_panorbit_camera = { version = "0.34", optional = true }

serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
crossbeam-channel = "0.5"

[target.'cfg(target_os = "android")'.dependencies]
bevy = { version = "0.18", default-features = false, features = ["android-native-activity"] }
android_logger = "0.15"
jni = { version = "0.21", default-features = false }
